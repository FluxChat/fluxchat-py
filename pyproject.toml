[project]
name = "fluxchat-py"
version = "0.1.0"
description = "A decentralized, peer-to-peer, encrypted chat written in Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sty==1.0.*",
    "cryptography==44.0.*",
    "cffi",
    "base58==2.1.*",
    "aiohttp==3.11.13",
]

[dependency-groups]
dev = [
    "coverage==7.2.*",
    "debugpy==1.8.*",
]

[tool.uv]
package = false
